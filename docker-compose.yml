services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rover-api
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=database;Port=3306;Database=RoverSOSDb;User=rover_admin;Password=SuperSecretPassword123!;"

    ports:
      - "8080:8080"

  database:
    image: mysql:8.0

    container_name: rover-database
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: RoverSOSDb
      MYSQL_USER: rover_admin
      MYSQL_PASSWORD: SuperSecretPassword123!

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-urover_admin", "-pSuperSecretPassword123!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data: